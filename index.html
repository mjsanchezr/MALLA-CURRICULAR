    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --highlight-pre: #ef4444; /* Red for prerequisites */
            --highlight-post: #3b82f6; /* Blue for post-requisites */
            --highlight-active: #10b981; /* Green for hovered subject */
            
            /* Area colors */
            --color-programacion: rgba(16, 185, 129, 0.2);
            --border-programacion: rgba(16, 185, 129, 0.5);
            
            --color-matematicas: rgba(59, 130, 246, 0.2);
            --border-matematicas: rgba(59, 130, 246, 0.5);
            
            --color-ciencias: rgba(139, 92, 246, 0.2);
            --border-ciencias: rgba(139, 92, 246, 0.5);
            
            --color-gestion: rgba(245, 158, 11, 0.2);
            --border-gestion: rgba(245, 158, 11, 0.5);
            
            --color-general: rgba(236, 72, 153, 0.2);
            --border-general: rgba(236, 72, 153, 0.5);
            
            --color-electiva: rgba(100, 116, 139, 0.2);
            --border-electiva: rgba(100, 116, 139, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            overflow-x: auto;
            background-image: 
                radial-gradient(at 0% 0%, rgba(15, 23, 42, 1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(30, 58, 138, 0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(15, 23, 42, 1) 0, transparent 50%);
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            text-align: center;
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .malla-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
        }

        @media (max-width: 1280px) {
            .malla-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .malla-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .legend {
                flex-direction: column;
                align-items: flex-start;
            }
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .malla-container {
                grid-template-columns: 1fr;
            }
        }

        .semester-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .semester-header {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-weight: 600;
            color: #cbd5e1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .subject-code {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subject-name {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: auto;
            color: #f1f5f9;
        }

        .subject-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        .subject-uc {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .req-indicator {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Area styles */
        .area-programacion { background: var(--color-programacion); border-left: 4px solid var(--border-programacion); }
        .area-matematicas { background: var(--color-matematicas); border-left: 4px solid var(--border-matematicas); }
        .area-ciencias { background: var(--color-ciencias); border-left: 4px solid var(--border-ciencias); }
        .area-gestion { background: var(--color-gestion); border-left: 4px solid var(--border-gestion); }
        .area-general { background: var(--color-general); border-left: 4px solid var(--border-general); }
        .area-electiva { background: var(--color-electiva); border-left: 4px solid var(--border-electiva); }

        /* Interaction States */
        body.interacting .subject-card {
            opacity: 0.3;
            filter: grayscale(80%);
        }

        body.interacting .subject-card.is-active {
            opacity: 1;
            filter: grayscale(0%);
            border-color: var(--highlight-active);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
        }

        body.interacting .subject-card.is-pre {
            opacity: 1;
            filter: grayscale(0%);
            border-color: var(--highlight-pre);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        body.interacting .subject-card.is-post {
            opacity: 1;
            filter: grayscale(0%);
            border-color: var(--highlight-post);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        .uc-tracker {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
        }
        
        .uc-tracker h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #3b82f6;
        }
        
        .uc-tracker p {
            margin: 5px 0;
            font-size: 0.9rem;
        }
        
        .subject-tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 250px;
            z-index: 1000;
            display: none;
            pointer-events: none;
            color: #f1f5f9;
            backdrop-filter: blur(10px);
        }
        
        .tooltip-title { font-weight: 700; color: #3b82f6; margin-bottom: 8px; font-size: 0.95rem; }
        .tooltip-row { margin-bottom: 5px; font-size: 0.85rem; }
        .tooltip-label { color: #94a3b8; font-weight: 600; }
    </style>
</head>

        const container = document.getElementById('malla');
        const ucTracker = document.getElementById('ucTracker');
        const tooltip = document.getElementById('subjectTooltip');
        
        // Flatten courses for easy lookup by name
        const coursesByName = {};
        let totalUC = 0;
        
        // First pass: create DOM and index courses
        mallaData.forEach((semester, sIndex) => {
            const semCol = document.createElement('div');
            semCol.className = 'semester-col';
            
            const header = document.createElement('div');
            header.className = 'semester-header';
            
            let semUC = semester.reduce((sum, course) => {
                const uc = parseInt(course.uc) || 0;
                return sum + uc;
            }, 0);
            
            header.innerHTML = `Semestre ${sIndex + 1}<br><span style="font-size:0.8rem; font-weight:normal; color:#94a3b8">${semUC} UC</span>`;
            semCol.appendChild(header);
            
            semester.forEach(course => {
                coursesByName[course.nombre] = course;
                course.postreqs = []; // To populate later
                course.elementId = `course-${course.codigo.replace(/\s+/g, '-')}`;
                course.semesterIndex = sIndex + 1;
                
                const card = document.createElement('div');
                card.className = `subject-card area-${course.area}`;
                card.id = course.elementId;
                
                let reqText = '';
                if(course.prelaciones && course.prelaciones.length > 0) {
                    const reqTypes = course.prelaciones.map(p => p.tipo === 'UC' ? `${p.valor} UC` : 'Mat').join(', ');
                    reqText = `<span class="req-indicator">Pre: ${reqTypes}</span>`;
                }
                
                card.innerHTML = `
                    <div class="subject-code">${course.codigo}</div>
                    <div class="subject-name">${course.nombre}</div>
                    <div class="subject-footer">
                        <span class="subject-uc">${course.uc} UC</span>
                        ${reqText}
                    </div>
                `;
                
                card.addEventListener('mouseenter', (e) => handleHover(course, true, e));
                card.addEventListener('mouseleave', () => handleHover(course, false));
                card.addEventListener('mousemove', updateTooltipPosition);
                
                semCol.appendChild(card);
            });
            
            container.appendChild(semCol);
        });
        
        // Second pass: compute post-requisites
        mallaData.forEach(semester => {
            semester.forEach(course => {
                if (course.prelaciones) {
                    course.prelaciones.forEach(pre => {
                        if (pre.tipo === 'materia') {
                            const preCourse = coursesByName[pre.valor];
                            if (preCourse) {
                                preCourse.postreqs.push(course.nombre);
                            }
                        }
                    });
                }
            });
        });
        
        function updateTooltipPosition(e) {
            if(tooltip.style.display === 'block') {
                const x = e.pageX + 15;
                const y = e.pageY + 15;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }
        }

        function handleHover(course, isEntering, e) {
            if (isEntering) {
                document.body.classList.add('interacting');
                
                // Highlight active
                const activeEl = document.getElementById(course.elementId);
                if(activeEl) activeEl.classList.add('is-active');
                
                // Highlight prerequisites
                let ucReqStr = "";
                if (course.prelaciones) {
                    course.prelaciones.forEach(pre => {
                        if (pre.tipo === 'materia') {
                            const preCourse = coursesByName[pre.valor];
                            if (preCourse) {
                                const el = document.getElementById(preCourse.elementId);
                                if(el) el.classList.add('is-pre');
                            }
                        } else if (pre.tipo === 'UC') {
                            ucReqStr = `Requiere tener aprobadas <strong>${pre.valor} UC</strong> en total.`;
                        }
                    });
                }
                
                // Highlight post-requisites
                if (course.postreqs) {
                    course.postreqs.forEach(postName => {
                        const postCourse = coursesByName[postName];
                        if (postCourse) {
                            const el = document.getElementById(postCourse.elementId);
                            if(el) el.classList.add('is-post');
                        }
                    });
                }
                
                // Update tracker
                if(ucReqStr) {
                    ucTracker.style.display = 'block';
                    document.getElementById('ucTitle').innerText = course.nombre;
                    document.getElementById('ucReqs').innerHTML = ucReqStr;
                } else {
                    ucTracker.style.display = 'none';
                }
                
                // Show and populate tooltip
                let preNames = [];
                if(course.prelaciones) {
                    course.prelaciones.forEach(pre => {
                        if (pre.tipo === 'materia') preNames.push(pre.valor);
                    });
                }
                
                let tooltipHtml = `<div class="tooltip-title">${course.nombre}</div>`;
                tooltipHtml += `<div class="tooltip-row"><span class="tooltip-label">Código:</span> ${course.codigo}</div>`;
                tooltipHtml += `<div class="tooltip-row"><span class="tooltip-label">Semestre:</span> ${course.semesterIndex}</div>`;
                tooltipHtml += `<div class="tooltip-row"><span class="tooltip-label">UC:</span> ${course.uc}</div>`;
                
                if (preNames.length > 0) {
                    tooltipHtml += `<div class="tooltip-row"><span class="tooltip-label">Prelaciones:</span> ${preNames.join(', ')}</div>`;
                }
                if (ucReqStr) {
                    tooltipHtml += `<div class="tooltip-row"><span class="tooltip-label">Pre UC:</span> ${course.prelaciones.find(p=>p.tipo==='UC').valor} UC</div>`;
                }
                
                tooltip.innerHTML = tooltipHtml;
                tooltip.style.display = 'block';
                if(e) updateTooltipPosition(e);
                
            } else {
                document.body.classList.remove('interacting');
                
                // Remove all highlight classes
                document.querySelectorAll('.subject-card').forEach(el => {
                    el.classList.remove('is-active', 'is-pre', 'is-post');
                });
                
                ucTracker.style.display = 'none';
                tooltip.style.display = 'none';
            }
        }
    </script>
